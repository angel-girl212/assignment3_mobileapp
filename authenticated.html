let enableAlerts = true; // Set the enable alert mode to be on when true

function toggleAlerts() { // function to disable/enable alerts
  enableAlerts = !enableAlerts; // If it's true, sets it to false and vice-versa
  const BUTTON_ELEMENT = document.getElementById("toggleAlerts"); // Get the button element

  if (enableAlerts) { // If enableAlerts is set to true

    BUTTON_ELEMENT.style.backgroundColor = "red";
  }
  else { // If it is set to false
    BUTTON_ELEMENT.textContent = "Enable ATM Alerts";

  }
}

// Close the dropdown if the user clicks outside of it
window.onclick = function(event) {
  if (!event.target.matches('.dropbtn')) {
    var dropdowns = document.getElementsByClassName("dropdown-content");
    var i;
    for (i = 0; i < dropdowns.length; i++) {
      var openDropdown = dropdowns[i];
      if (openDropdown.classList.contains('show')) {

      }
    }
  }
}

function TrackUser() {

  // If no user is selected, alert
  if (!SelectedUser) {
    alert("User Selection Required!");
    return; // stop the function
  }
 
  // If user is selected and no errors occur, start the tracking.
  // using setInterval, repeat function every 30 seconds.

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(success, error);
    Interval = setInterval(function() {
      navigator.geolocation.getCurrentPosition(success, error);
      }, 30000);
  } 
  // If other issues occurs:
  else { 
    x.innerHTML = "Geolocation is not supported by this browser.";
  }
}

//takes as input variables, reads and sends them to the

function writeToCSV(timestamp_in, userID_in, lat_in, lng_in){
	var user = {
    timestamp_in: encodeURIComponent(timestamp_in),
    userID_in: encodeURIComponent(userID_in),
    lat_in: encodeURIComponent(lat_in),
    lng_in: encodeURIComponent(lng_in),
	};	
	if(window.XMLHttpRequest){xmlhttp=new XMLHttpRequest();}
	else{xmlhttp=new ActiveXObject("Microsoft.XMLHTTP");}
	var url = "?timestamp="+user.timestamp_in+"&userID="+user.userID_in+"&lat="+user.lat_in+"&lng="+user.lng_in;
	var sendUrl = 'writetojson.php' + url;
	xmlhttp.open("GET", sendUrl, false); 
	xmlhttp.send();
}

// Finding the distance between 2 points using the Haversine Formula
function getDistance(lat1, lon1, lat2, lon2) {
    const radius = 6371000; // Earth's radius in meters
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * Math.PI / 180) *
      Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return radius * c;
  }
